# ==========================================
# APPLICATION
# ==========================================
spring.application.name=SneakX
server.port=${SERVER_PORT:8080}

# Load local .env file
spring.config.import=optional:file:.env[.properties]


# ==========================================
# MYSQL
# ==========================================
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:sneakx_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}


# ==========================================
# JPA
# ==========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false


# ==========================================
# FLYWAY
# ==========================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration


# ==========================================
# JWT
# ==========================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}


# ==========================================
# RAZORPAY
# ==========================================
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}


# ==========================================
# LOGGING
# ==========================================
logging.level.org.springframework.security=INFO
logging.level.com.sneakx.security=INFO

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# OTP 
otp.log.console=${OTP_LOG_CONSOLE:false}
otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:10}
password-reset.token-expiration-minutes=${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:10}